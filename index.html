em, pick NZC or ZC, run. The DUT, FIX-1 and FIX-2 are added to the library.`,`IEEE 370 self-check: de-embed the 2x-Thru from itself. Residual insertion loss should stay inside ±0.1 dB and residual phase inside ±1°. The tool reports the highest frequency where that still holds — that is the fixture’s usable bandwidth.`]},{id:`quality`,title:`Passivity, causality, fixture FER`,body:[`Passivity — the largest singular value of S must be ≤ 1 at every frequency. Score is the fraction of points that pass (IEEE 370 FD-QM thresholds: good > 99.9%).`,`Causality — transmission group delay should be non-negative (energy cannot emerge before it is launched). Score uses IEEE 370-style good / acceptable / inconclusive / poor bins.`,`Reciprocity — |Sij| ≈ |Sji| for passive interconnects.`,`Fixture electrical requirements (FER) run on a 2x-Thru: self-de-embed residual, line impedance ripple from TDR, electrical length, and a class A/B/C/fail. The reported f_valid is the frequency up to which the fixture is trustworthy.`]},{id:`tdr`,title:`TDR, step, and distance`,body:[`TDR is a windowed IFFT of S11 (or TDT of S21). Views: impedance vs time, reflected step, impulse response, and the ideal input step.`,`Distance uses two dielectrics so a coax launch plus a PCB can share one axis. Time in the first section uses Dk(coax); after the breakpoint it uses Dk(PCB). Round-trip is on for TDR (divide by 2) and off for TDT.`,`v = c / √Dk. One-way distance = v · t / 2 for TDR. Save the current TDR table (time, step, Γ, Z, distance) as CSV.`]},{id:`math`,title:`Mixed-mode, terminate, equations`,body:[`Terminate unused ports — for a 4-port, terminate ports 3 and 4 in 50 Ω (or 250 Ω, or any real load) to reduce it to an S2P of the remaining ports. The remaining S is the standard bilinear termination: S′ij = Sij + Sik Skj Γ / (1 − Skk Γ).`,`SDD11 — for a differential pair on ports P+ and P−: SDD11 = ½ (S++ − S+− − S−+ + S−−). That is the half equation used in SI when you only need the near-end differential return loss.`,`Full mixed-mode converts a 4-port to D1, D2, C1, C2 (scikit-rf se2gmm). You can then keep SDD, SCC, or the mode-conversion blocks.`,`Also: cascade 2-ports, invert (error-box inverse), flip ports, renormalize Z0, and cut a frequency window.`]},{id:`limits`,title:`Limit lines`,body:[`Load a CSV mask and overlay it on magnitude plots. Two layouts are accepted: freq_ghz,upper_db,lower_db or freq,value,side with side = upper|lower.`,`Violations are counted against the first visible trace. A sample insertion-loss mask ships with the app.`]},{id:`validate`,title:`Reference checks`,body:[`The Validate tool runs the engine against the synthetic reference kit: self-de-embed residual, DUT recovery, Beatty 25 Ω TDR well, 4-port terminate → S2P, SDD11, and passivity of a passive 2x-Thru.`,`If those pass, the same code path is what runs on your measured files.`]}];function Ci(){return(0,D.jsxs)(`div`,{className:`space-y-6 pb-8`,children:[(0,D.jsxs)(`header`,{children:[(0,D.jsx)(`h2`,{className:`text-lg font-medium tracking-tight`,children:`Handbook`}),(0,D.jsx)(`p`,{className:`mt-1 text-sm text-muted`,children:`IEEE 370 · N-port S-parameters · TDR. Methods match scikit-rf.`})]}),Si.map(e=>(0,D.jsxs)(`section`,{className:`space-y-2`,children:[(0,D.jsx)(`h3`,{className:`text-sm font-medium text-fg`,children:e.title}),e.body.map(e=>(0,D.jsx)(`p`,{className:`text-sm leading-relaxed text-muted`,children:e},e))]},e.id))]})}function wi(e){return e.replace(/\\r\\n/g,`\n`).split(`\n`).map(e=>e.trim()).filter(e=>e&&!e.startsWith(`#`)&&!e.startsWith(`//`)).map(e=>e.split(/[,\\t;]/).map(e=>e.trim()))}function Ti(e){let t=Number(e);if(!Number.isFinite(t))throw Error(`Not a number: ${e}`);return t}function Ei(e,t=`limit`){let n=wi(e);if(n.length\u003c2)throw Error(`Limit CSV needs a header and at least one data row.`);let r=n[0].map(e=>e.toLowerCase()),i=n.slice(1),a=r.findIndex(e=>/freq|ghz|hz|x/.test(e)),o=r.findIndex(e=>/upper|max|hi/.test(e)),s=r.findIndex(e=>/lower|m
